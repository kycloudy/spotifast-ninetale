name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CMAKE_GENERATOR: Ninja
    # A cold mbx cache on Windows (projectM through cmake) needs about 30
    # minutes before the action saves the cache; warm runs take far less.
    # The arm64 runner has four cores and needs longer from cold.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Spotifast Ninetale ships for Windows only, so CI tests the two
        # Windows builds it ships. windows-11-arm is the only place the
        # Windows on ARM build is tested.
        os: [windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # libprojectM reads OpenGL through GLEW on Windows; projectm-sys builds
      # against vcpkg's static-CRT triplet, matching .cargo/config.toml.
      - name: GLEW for libprojectM
        run: vcpkg install glew:${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}-windows-static
      # projectm-sys asks CMake for the Visual Studio generator, which the
      # runner image no longer satisfies; Ninja inside the MSVC environment
      # builds the same thing without caring which Visual Studio is on. The
      # generator is job-level env, since a GITHUB_ENV write never reached
      # the build script.
      # Native tools on each runner: the action's default is x64, which on
      # the arm64 runner would compile under emulation.
      - name: MSVC environment for libprojectM
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ runner.arch == 'ARM64' && 'arm64' || 'x64' }}
      - uses: jdx/mr-boxington-action@v1
        with:
          cache-generation: test-v1
      # Formatting and lints, once.
      - name: Formatting
        if: matrix.os == 'windows-latest'
        run: cargo fmt --all --check
      - name: Clippy (default features)
        if: matrix.os == 'windows-latest'
        run: mbx clippy --locked --all-targets -- -D warnings
      - name: Clippy (all features)
        if: matrix.os == 'windows-latest'
        run: mbx clippy --locked --all-targets --all-features -- -D warnings
      # The demo feature carries the headless render test that lays out every
      # page, panel, and dialog without a display.
      - name: Tests (default features)
        run: mbx test --locked --all-targets
      - name: Tests (all features)
        run: mbx test --locked --all-targets --all-features
      - name: Native credential store (dummy grants)
        timeout-minutes: 2
        run: mbx test --locked --lib credentials::tests::native_store_round_trip -- --ignored --exact
      - name: Documentation tests
        run: mbx test --locked --all-features --doc
      # A build can pass while importing Microsoft's C++ runtime, then fail on
      # a clean user's machine. Inspect the executable CI actually produced.
      - name: Standalone Windows runtime
        shell: pwsh
        run: |
          mbx build --locked
          $imports = & dumpbin /dependents target\debug\spotifast.exe | Out-String
          $runtime = $imports | Select-String -Pattern 'MSVCP[0-9_]*\.dll|VCRUNTIME[0-9_]*\.dll'
          if ($runtime) { throw "Spotifast imports an MSVC runtime:`n$runtime" }
          $machine = if ($env:RUNNER_ARCH -eq 'ARM64') { 'AA64 machine \(ARM64\)' } else { '8664 machine \(x64\)' }
          $headers = & dumpbin /headers target\debug\spotifast.exe | Out-String
          if ($headers -notmatch $machine) { throw "spotifast.exe is not built for $env:RUNNER_ARCH`:`n$headers" }

      - name: Windows installer syntax and renamed inputs
        shell: pwsh
        run: |
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64' } else { 'x86_64' }
          & $iscc "/DVersion=$version" "/DArch=$arch" "/DBinary=$PWD\target\debug\spotifast.exe" "/DOutputDir=$env:RUNNER_TEMP\spotifast-installer-check" packaging\windows\spotifast.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The Windows Installer package, which native-packages builds as the
      # release does (native-packages.yaml), from the executable built above.
      - uses: ruby/setup-ruby@v1
        if: runner.os == 'Windows'
        with:
          ruby-version: '4.0'
      - name: Windows Installer package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install wix --version 5.0.2 --tool-path "$env:RUNNER_TEMP\wix"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:RUNNER_TEMP\wix" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          $env:PATH = "$env:RUNNER_TEMP\wix;$env:PATH"
          gem install native-packages --version 0.10.0 --no-document
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages[0].version
          $target, $id = if ($env:RUNNER_ARCH -eq 'ARM64') { 'aarch64-pc-windows-msvc', 'windows-arm64' } else { 'x86_64-pc-windows-msvc', 'windows-amd64' }
          $payload = "dist\msi-input-$target"
          New-Item -ItemType Directory -Force $payload | Out-Null
          Copy-Item target\debug\spotifast.exe, README.md, LICENSE, packaging\windows\spotifast-installer.txt $payload
          native-packages build --version $version --target $id --defer-recipes --output "$env:RUNNER_TEMP\spotifast-msi-check"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # Installs, updates and removes throwaway copies of the package, with
      # an identity of their own: a running copy, a portable copy, and an
      # Inno Setup install it takes over (#766 and the updater's contract).
      - name: Windows Installer install, update and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          python packaging\windows\test-msi.py $iscc -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
